<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - NaviMAS 智游图谱</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* 视频背景样式 */
        #video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            object-fit: cover; /* 确保视频铺满屏幕不拉伸 */
        }

        /* 覆盖一层半透明蒙版，确保文字清晰 */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3); /* 浅黑色滤镜 */
            z-index: -99;
        }

        .dark .video-overlay {
            background: rgba(0, 0, 0, 0.5); /* 深色模式下滤镜加深 */
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 h-screen flex items-center justify-center font-sans transition-colors duration-300 relative overflow-hidden">

    <video autoplay muted loop playsinline id="video-background">
        <source src="loginVideo.mp4" type="video/mp4">
        您的浏览器不支持 HTML5 视频。
    </video>

    <div class="video-overlay"></div>

    <button onclick="toggleTheme()" class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center rounded-full bg-white/20 backdrop-blur-md dark:bg-gray-800/40 border border-white/30 dark:border-gray-700 text-white dark:text-gray-400 hover:bg-white/30 shadow-sm transition-all duration-300 z-50 focus:outline-none active:scale-95">
        <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
    </button>

    <div class="w-full max-w-md px-6 relative z-10 fade-in-up">
        <div class="bg-white/70 dark:bg-gray-800/70 backdrop-blur-2xl rounded-3xl shadow-2xl border border-white/20 dark:border-gray-700/30 p-8 sm:p-10 overflow-hidden relative">

            <div class="text-center mb-10 relative z-10">
                <div class="mx-auto mb-5 transform transition-transform hover:scale-105">
                    <img src="logo.png" alt="Logo" class="h-24 mx-auto object-contain">
                </div>
                <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-100 tracking-wide mb-2">NaviMAS 智游图谱</h1>
                <p class="text-xs text-gray-600 dark:text-gray-300 font-medium">多智能体协同行程规划系统</p>
            </div>

            <form id="login-form" class="space-y-6 relative z-10" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-2 uppercase tracking-wider">邮箱 / 账号</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-user text-gray-400 group-focus-within:text-emerald-500 transition-colors"></i>
                        </div>
                        <input type="text" id="username" required value=""
                            class="w-full bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-100 rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-sm"
                            placeholder="输入您的账号">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider">密码</label>
                        <a href="register.html" class="text-xs text-emerald-600 dark:text-emerald-400 hover:text-emerald-500 font-medium transition-colors">新建用户</a>
                    </div>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i class="fa-solid fa-lock text-gray-400 group-focus-within:text-emerald-500 transition-colors"></i>
                        </div>
                        <input type="password" id="password" required value=""
                            class="w-full bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-100 rounded-xl pl-11 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-sm"
                            placeholder="输入您的密码">
                    </div>
                </div>

                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-500/30 transform transition-all active:scale-[0.98] flex justify-center items-center group">
                    <span id="btn-text">进入智游系统</span>
                    <i id="btn-icon" class="fa-solid fa-arrow-right ml-2 group-hover:translate-x-1 transition-transform"></i>
                    <i id="btn-spinner" class="fa-solid fa-circle-notch fa-spin ml-2 hidden"></i>
                </button>
            </form>
        </div>

        <div class="text-center mt-8 text-xs text-white/80 dark:text-gray-400 font-medium drop-shadow-md">
            <p>基于 TDAG 与多智能体协同架构</p>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.classList.remove('fa-sun', 'text-amber-400');
                icon.classList.add('fa-moon', 'text-gray-500');
            } else {
                html.classList.add('dark');
                icon.classList.remove('fa-moon', 'text-gray-500');
                icon.classList.add('fa-sun', 'text-amber-400');
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const btnSpinner = document.getElementById('btn-spinner');

            btn.classList.add('opacity-90', 'cursor-not-allowed');
            btnText.innerText = '正在唤醒 Agent...';
            btnIcon.classList.add('hidden');
            btnSpinner.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        }
    </script>
</body>
</html>
