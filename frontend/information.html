        function loadAndRenderSeason(season = '春') {
            const container = document.getElementById('news-container');
            const skeleton = document.getElementById('loading-skeleton');

            container.classList.add('hidden');
            skeleton.classList.remove('hidden');

            setTimeout(() => {
                skeleton.classList.add('hidden');
                container.classList.remove('hidden');

                const data = seasonData[season];
                let html = '';

                data.forEach((item, index) => {
                    const tagBg = `bg-${item.tagColor}-500/20`;
                    const tagText = `text-${item.tagColor}-100`;

                    html += `
                        <div class="group relative bg-white/70 dark:bg-gray-800/60 backdrop-blur-xl rounded-[2rem] overflow-hidden shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_30px_rgb(0,0,0,0.2)] border border-white/60 dark:border-gray-700/50 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgb(16,185,129,0.15)] transition-all duration-500 fade-in flex flex-col" style="animation-delay: ${index * 0.1}s">

                            <div class="relative h-60 overflow-hidden">
                                <img src="${item.img}" alt="${item.region}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-out">
                                <div class="absolute inset-0 bg-gradient-to-t from-gray-900/90 via-gray-900/20 to-transparent opacity-90"></div>

                                <div class="absolute top-5 left-5">
                                    <span class="${tagBg} ${tagText} text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-md border border-white/20 shadow-sm flex items-center gap-1.5">
                                        <i class="fa-solid fa-hashtag text-[10px] opacity-80"></i> ${item.tag}
                                    </span>
                                </div>

                                <div class="absolute bottom-5 left-5 right-5">
                                    <div class="flex items-center gap-2 text-emerald-300 text-sm font-semibold mb-2">
                                        <i class="fa-solid fa-location-dot"></i> ${item.region}
                                    </div>
                                    <h3 class="text-2xl font-extrabold text-white leading-tight drop-shadow-lg">${item.title}</h3>
                                </div>
                            </div>

                            <div class="p-6 flex flex-col flex-1">
                                <div class="inline-flex items-center gap-2 text-xs font-bold text-orange-600 dark:text-orange-400 bg-orange-100/50 dark:bg-orange-500/10 w-fit px-3 py-1.5 rounded-lg mb-4">
                                    ${item.stats}
                                </div>
                                <p class="text-[15px] text-gray-600 dark:text-gray-300 line-clamp-2 mb-8 flex-1 leading-relaxed">${item.desc}</p>

                                <button onclick="importToPlanner('${item.region}', '${item.intentText}')" class="w-full py-4 bg-gray-900 dark:bg-white text-white dark:text-gray-900 hover:bg-emerald-500 dark:hover:bg-emerald-400 rounded-2xl text-sm font-bold transition-all duration-300 shadow-lg hover:shadow-emerald-500/40 flex items-center justify-center gap-2 active:scale-[0.98] group/btn">
                                    <i class="fa-solid fa-wand-magic-sparkles text-emerald-400 group-hover/btn:text-white dark:text-emerald-600 dark:group-hover/btn:text-gray-900 transition-colors"></i>
                                    导入 Agent 生成规划图谱
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }, 500);
        }

        function changeSeason(season, element) {
            const buttons = document.querySelectorAll('.season-btn');
            buttons.forEach(btn => {
                btn.className = "season-btn relative px-6 py-3 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md text-gray-600 dark:text-gray-300 border border-gray-200/50 dark:border-gray-700/50 text-sm font-bold rounded-2xl shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 whitespace-nowrap group";

                // 移除选中按钮内部的渐变层（如果之前有的话）
                const activeBg = btn.querySelector('.absolute.inset-0');
                if (activeBg) activeBg.remove();

                // 恢复文字图标颜色
                const span = btn.querySelector('span');
                if(span) span.className = span.className.replace('text-white', '').replace('dark:text-gray-900', '');
            });

            element.className = "season-btn relative px-6 py-3 bg-gray-900 dark:bg-white text-white dark:text-gray-900 text-sm font-bold rounded-2xl shadow-xl shadow-gray-900/20 dark:shadow-white/10 hover:-translate-y-1 transition-all duration-300 whitespace-nowrap overflow-hidden group";

            // 给当前选中按钮加特效层
            element.innerHTML = `
                <span class="relative z-10 flex items-center gap-2">${element.innerText.trim()}</span>
                <div class="absolute inset-0 bg-gradient-to-r from-gray-800 to-gray-900 dark:from-gray-100 dark:to-white opacity-0 group-hover:opacity-100 transition-opacity"></div>
            `;

            loadAndRenderSeason(season);
        }

        function importToPlanner(region, intent) {
            const url = `index.html?region=${encodeURIComponent(region)}&intent=${encodeURIComponent(intent)}`;
            window.location.href = url;
        }

        window.addEventListener('DOMContentLoaded', () => loadAndRenderSeason('春'));
    </script>
</body>
</html>
