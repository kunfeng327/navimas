<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人行程档案 - NaviMAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script>
        // 后端 API 基础路径（优先使用 frontend/config.js 中的 window.ENV.API_BASE）
        const __API_BASE__ = (window.ENV && typeof window.ENV.API_BASE === 'string') ? window.ENV.API_BASE.replace(/\/$/, '') : '';
        function buildApi(path) { return (__API_BASE__ ? __API_BASE__ : '') + path; }
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 隐藏滚动条 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* 动态背景 */
        .bg-animated {
            background-size: 200% 200%;
            animation: gradientMove 15s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 表格可编辑单元格的过渡效果 */
        [contenteditable="true"] { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50/50 to-indigo-50 dark:from-gray-900 dark:via-[#0f172a] dark:to-[#1e293b] bg-animated text-gray-800 dark:text-gray-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white transition-colors duration-500">

    <header class="sticky top-0 z-50 backdrop-blur-xl bg-white/70 dark:bg-gray-900/70 border-b border-white/20 dark:border-gray-700/30 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='index.html'" class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 shadow-sm hover:shadow-md hover:-translate-x-1 flex items-center justify-center text-gray-600 dark:text-gray-300 transition-all duration-300 border border-gray-100 dark:border-gray-700">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h1 class="text-xl font-black tracking-tight flex items-center gap-2 bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-green-400 dark:from-emerald-400 dark:to-green-300">
                    <img src="logo.png" alt="NaviMAS Logo" class="w-8 h-8 object-contain drop-shadow-sm">
                    个人旅行档案
                </h1>
            </div>
            <div id="save-status" class="text-sm font-bold text-emerald-500 bg-emerald-50 dark:bg-emerald-900/30 px-4 py-2 rounded-full border border-emerald-100 dark:border-emerald-800/50 flex items-center gap-2 shadow-sm transition-all duration-300 opacity-0 translate-y-[-10px]">
                <i class="fa-solid fa-circle-check animate-bounce"></i> 数据已同步云端
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8 fade-in">
            <div class="relative bg-white/60 dark:bg-gray-800/60 backdrop-blur-xl p-6 rounded-[2rem] shadow-sm border border-white/60 dark:border-gray-700/50 hover:shadow-xl hover:-translate-y-1.5 transition-all duration-500 overflow-hidden group">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-blue-400/20 dark:bg-blue-500/10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700"></div>
                <div class="relative z-10 flex flex-col h-full justify-between">
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-gray-500 dark:text-gray-400 text-sm font-bold tracking-wide">总计出行</div>
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-100 to-blue-50 dark:from-blue-900/50 dark:to-blue-800/30 flex items-center justify-center text-blue-600 dark:text-blue-400 shadow-sm border border-white/50 dark:border-gray-700/50"><i class="fa-solid fa-plane-departure"></i></div>
                    </div>
                    <div class="text-4xl font-black text-gray-900 dark:text-white tracking-tight" id="stat-trips">-</div>
                </div>
            </div>

            <div class="relative bg-white/60 dark:bg-gray-800/60 backdrop-blur-xl p-6 rounded-[2rem] shadow-sm border border-white/60 dark:border-gray-700/50 hover:shadow-xl hover:-translate-y-1.5 transition-all duration-500 overflow-hidden group">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-emerald-400/20 dark:bg-emerald-500/10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700"></div>
                <div class="relative z-10 flex flex-col h-full justify-between">
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-gray-500 dark:text-gray-400 text-sm font-bold tracking-wide">最常去目的地</div>
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-100 to-emerald-50 dark:from-emerald-900/50 dark:to-emerald-800/30 flex items-center justify-center text-emerald-600 dark:text-emerald-400 shadow-sm border border-white/50 dark:border-gray-700/50"><i class="fa-solid fa-heart"></i></div>
                    </div>
                    <div class="text-3xl font-black text-emerald-600 dark:text-emerald-400 tracking-tight" id="stat-fav">-</div>
                </div>
            </div>

            <div class="relative bg-white/60 dark:bg-gray-800/60 backdrop-blur-xl p-6 rounded-[2rem] shadow-sm border border-white/60 dark:border-gray-700/50 hover:shadow-xl hover:-translate-y-1.5 transition-all duration-500 overflow-hidden group">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-orange-400/20 dark:bg-orange-500/10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700"></div>
                <div class="relative z-10 flex flex-col h-full justify-between">
                    <div class="flex items-center justify-between mb-4">
                        <div class="text-gray-500 dark:text-gray-400 text-sm font-bold tracking-wide">累计预估花费</div>
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-100 to-orange-50 dark:from-orange-900/50 dark:to-orange-800/30 flex items-center justify-center text-orange-600 dark:text-orange-400 shadow-sm border border-white/50 dark:border-gray-700/50"><i class="fa-solid fa-wallet"></i></div>
                    </div>
                    <div class="text-4xl font-black text-orange-500 dark:text-orange-400 tracking-tight" id="stat-cost">¥ 0</div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">

            <div class="xl:col-span-1 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none border border-white/60 dark:border-gray-700/50 fade-in flex flex-col" style="animation-delay: 0.2s">
                <div class="flex items-center gap-2 mb-6">
                    <div class="w-1.5 h-6 bg-blue-500 rounded-full"></div>
                    <h2 class="text-lg font-extrabold text-gray-800 dark:text-gray-100 tracking-wide">目的地分布</h2>
                </div>
                <div id="pieChart" class="w-full flex-1 min-h-[300px]"></div>
            </div>

            <div class="xl:col-span-2 bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none border border-white/60 dark:border-gray-700/50 fade-in flex flex-col" style="animation-delay: 0.3s">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                    <div class="flex items-center gap-2">
                        <div class="w-1.5 h-6 bg-indigo-500 rounded-full"></div>
                        <h2 class="text-lg font-extrabold text-gray-800 dark:text-gray-100 tracking-wide">足迹明细与管理</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="addNewRecord(this)" class="bg-indigo-500 hover:bg-indigo-600 text-white dark:bg-indigo-600 dark:hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-md active:scale-95 flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 手动添加足迹
                        </button>
                    </div>
                </div>

                <div class="overflow-x-auto rounded-2xl border border-gray-100 dark:border-gray-700/50">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50/80 dark:bg-gray-900/50 text-gray-500 dark:text-gray-400 text-xs uppercase tracking-widest border-b border-gray-100 dark:border-gray-700">
                                <th class="p-4 font-bold whitespace-nowrap">日期</th>
                                <th class="p-4 font-bold whitespace-nowrap">目的地</th>
                                <th class="p-4 font-bold min-w-[250px]">核心景点分布</th>
                                <th class="p-4 font-bold whitespace-nowrap">花费 (¥)</th>
                                <th class="p-4 font-bold whitespace-nowrap text-center">云同步</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-sm divide-y divide-gray-100 dark:divide-gray-800/50">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let myChart = null;

        async function loadProfileData() {
            try {
                const response = await fetch(buildApi('/api/profile'));
                const data = await response.json();

                if (data.status === 'success') {
                    renderStats(data.stats);
                    renderPieChart(data.pie_data);
                    renderTable(data.table_data);
                }
            } catch (error) {
                console.error("加载档案数据失败:", error);
            }
        }

        function renderStats(stats) {
            document.getElementById('stat-trips').innerText = stats.total_trips;
            document.getElementById('stat-fav').innerText = stats.favorite_city;
            document.getElementById('stat-cost').innerText = '¥ ' + stats.total_cost.toLocaleString();
        }

        function renderPieChart(pieData) {
            if (!myChart) {
                myChart = echarts.init(document.getElementById('pieChart'));
            }

            // 为 Echarts 提供更好看的现代感色彩
            const colorPalette = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

            const option = {
                color: colorPalette,
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}: {c}次 ({d}%)',
                    backgroundColor: 'rgba(255, 255, 255, 0.9)',
                    borderColor: '#e2e8f0',
                    textStyle: { color: '#1e293b', fontWeight: 'bold' },
                    borderRadius: 12,
                    padding: [10, 15]
                },
                legend: {
                    bottom: '0%',
                    icon: 'circle',
                    itemWidth: 10,
                    textStyle: { color: '#64748b', fontWeight: 600 }
                },
                series: [
                    {
                        name: '目的地',
                        type: 'pie',
                        radius: ['50%', '75%'], // 更细的环形图设计
                        center: ['50%', '45%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 12,
                            borderColor: '#ffffff',
                            borderWidth: 3
                        },
                        label: { show: false, position: 'center' },
                        emphasis: {
                            label: { show: true, fontSize: 24, fontWeight: '900', color: '#1e293b' },
                            itemStyle: { shadowBlur: 10, shadowOffsetX: 0, shadowColor: 'rgba(0, 0, 0, 0.1)' }
                        },
                        labelLine: { show: false },
                        data: pieData
                    }
                ]
            };
            myChart.setOption(option);
        }

        function renderTable(tableData) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            tableData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'bg-gray-50/50 dark:bg-gray-900/30 hover:bg-white dark:hover:bg-gray-800 transition-all group';
                tr.innerHTML = `
                    <td class="p-4 align-top w-28">
                        <div class="relative group/edit">
                            <div contenteditable="true" data-field="date" data-id="${row.id}" class="inline-flex items-center px-2 py-1.5 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700/50 text-gray-500 dark:text-gray-400 font-medium text-xs transition-all border border-transparent focus:border-gray-300 focus:bg-white outline-none">
                                ${row.date}
                            </div>
                        </div>
                    </td>

                    <td class="p-4 align-top w-24">
                        <div class="relative group/edit">
                            <div contenteditable="true" data-field="destination" data-id="${row.id}" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/30 text-gray-800 dark:text-gray-200 font-bold transition-all border border-transparent focus:border-blue-300 focus:bg-white outline-none">
                                ${row.destination}
                            </div>
                        </div>
                    </td>

                    <td class="p-4 align-top">
                        <div class="relative group/edit">
                            <div contenteditable="true" data-field="attractions" data-id="${row.id}" class="block w-full px-3 py-1.5 rounded-xl hover:bg-indigo-50 dark:hover:bg-indigo-900/30 text-gray-600 dark:text-gray-400 transition-all border border-transparent focus:border-indigo-300 focus:bg-white outline-none leading-relaxed">
                                ${row.attractions}
                            </div>
                        </div>
                    </td>

                    <td class="p-4 align-top w-24">
                        <div class="relative group/edit">
                            <div contenteditable="true" data-field="cost" data-id="${row.id}" class="inline-flex items-center px-3 py-1.5 rounded-xl hover:bg-orange-50 dark:hover:bg-orange-900/30 text-orange-600 dark:text-orange-400 font-bold transition-all border border-transparent focus:border-orange-300 focus:bg-white outline-none">
                                ${row.cost}
                            </div>
                        </div>
                    </td>

                    <td class="p-4 text-center align-top w-36">
                        <div class="flex gap-2 justify-center">
                            <button onclick="saveRow(${row.id}, this)" class="flex-1 bg-gray-900 hover:bg-emerald-500 text-white dark:bg-white dark:text-gray-900 dark:hover:bg-emerald-400 text-xs font-bold px-3 py-2 rounded-xl transition-all duration-300 shadow-md shadow-gray-900/10 hover:shadow-emerald-500/30 active:scale-95 flex items-center justify-center gap-1.5 group/btn" title="保存修改">
                                <i class="fa-solid fa-cloud-arrow-up text-gray-400 group-hover/btn:text-white dark:text-gray-500 dark:group-hover/btn:text-gray-900 transition-colors"></i>
                            </button>
                            <button onclick="deleteRow(${row.id}, this)" class="bg-red-50 hover:bg-red-500 text-red-500 hover:text-white dark:bg-red-900/30 dark:hover:bg-red-600 px-3 py-2 rounded-xl text-xs font-bold transition-all duration-300 shadow-sm active:scale-95 flex items-center justify-center" title="删除该记录">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function saveRow(id, btnElement) {
            const tr = btnElement.closest('tr');
            const updateData = {
                id: id,
                date: tr.querySelector('[data-field="date"]').innerText.trim(), // 读取日期
                destination: tr.querySelector('[data-field="destination"]').innerText.trim(),
                attractions: tr.querySelector('[data-field="attractions"]').innerText.trim(),
                cost: parseFloat(tr.querySelector('[data-field="cost"]').innerText.trim().replace(/[^0-9.-]+/g,"")) || 0
            };

            btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            try {
                const response = await fetch(buildApi('/api/profile/update'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    showStatus("数据已保存");
                    loadProfileData();
                }
            } catch (error) { alert("保存失败，请检查后端服务。"); }
            finally { btnElement.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> <span>保存</span>`; }
        }


        function showSaveSuccess() {
            const status = document.getElementById('save-status');
            // 进场动画
            status.classList.remove('opacity-0', 'translate-y-[-10px]');
            status.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                // 退场动画
                status.classList.remove('opacity-100', 'translate-y-0');
                status.classList.add('opacity-0', 'translate-y-[-10px]');
            }, 2500);
        }

        async function addNewRecord(btnElement) {
            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 创建中...`;
            btnElement.disabled = true;

            try {
                const response = await fetch(buildApi('/api/profile/add'), { method: 'POST' });
                if (response.ok) {
                    await loadProfileData(); // 重新加载表格，新的一行就会出现在最上面
                    showStatus("➕ 已添加一条空记录，请在表格中直接修改！");
                }
            } catch (error) {
                alert("添加记录失败，请检查后端。");
            } finally {
                btnElement.innerHTML = originalHtml;
                btnElement.disabled = false;
            }
        }

        function showStatus(text) {
            const status = document.getElementById('save-status');
            status.innerHTML = text; // 动态改变提示文字
            status.classList.remove('opacity-0', 'translate-y-[-10px]');
            status.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                status.classList.remove('opacity-100', 'translate-y-0');
                status.classList.add('opacity-0', 'translate-y-[-10px]');
            }, 2500);
        }

        window.addEventListener('resize', () => {
            if (myChart) myChart.resize();
        });

        // 删除记录功能
        async function deleteRow(id, btnElement) {
            // 弹窗确认，防止误触
            if (!confirm("确定要删除这条足迹记录吗？\n删除后图表和总花费将重新计算。此操作不可恢复。")) {
                return;
            }

            const originalHtml = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btnElement.disabled = true;

            try {
                const response = await fetch(buildApi('/api/profile/delete'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });

                if (response.ok) {
                    showStatus("记录已删除");
                    await loadProfileData();
                } else {
                    alert("删除失败，未找到记录。");
                    btnElement.innerHTML = originalHtml;
                    btnElement.disabled = false;
                }
            } catch (error) {
                console.error("删除出错:", error);
                alert("请求出错，请检查后端服务。");
                btnElement.innerHTML = originalHtml;
                btnElement.disabled = false;
            }
        }

        window.addEventListener('DOMContentLoaded', loadProfileData);
    </script>
</body>
</html>
