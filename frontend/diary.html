<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随行日记本 - NaviMAS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'system-ui', 'sans-serif'],
                        serif: ['"Noto Serif SC"', '"Songti SC"', 'serif'] // 增加衬线体，更有日记的文学感
                    }
                }
            }
        }
    </script>

    <style>
        /* 滚动条美化 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

        /* 动态渐变背景 */
        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 100%);
        }
        .dark body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        /* 核心：精致的信笺纸横线效果 */
        .paper-texture {
            /* 设置行高为 2.5rem (40px) */
            line-height: 40px;
            /* 画出横线，完美贴合行高 */
            background-image: repeating-linear-gradient(
                transparent,
                transparent 39px,
                #e2e8f0 39px,
                #e2e8f0 40px
            );
            background-attachment: local; /* 让横线跟随文字一起滚动 */
        }

        .dark .paper-texture {
            background-image: repeating-linear-gradient(
                transparent,
                transparent 39px,
                #334155 39px,
                #334155 40px
            );
        }

        /* 隐藏输入框原生的聚焦边框 */
        textarea:focus { outline: none; box-shadow: none; }

        /* 动画 */
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-100 h-screen flex flex-col font-sans transition-colors duration-500 overflow-hidden">

    <header class="flex-none bg-white/70 dark:bg-gray-900/70 backdrop-blur-xl border-b border-emerald-100 dark:border-gray-800 p-4 px-6 flex justify-between items-center z-20 shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black tracking-tight flex items-center gap-2 bg-clip-text text-transparent bg-gradient-to-r from-emerald-500 to-green-400 dark:from-emerald-400 dark:to-green-300">
                <img src="logo.png" alt="NaviMAS Logo" class="w-8 h-8 object-contain drop-shadow-sm">
                NaviMAS 随行手账
            </h1>
        </div>

        <div id="save-status" class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1.5 font-bold bg-gray-100/80 dark:bg-gray-800 px-4 py-2 rounded-full transition-all duration-300">
            <i class="fa-solid fa-cloud-check text-emerald-500"></i> 数据已同步
        </div>
    </header>

    <main class="flex-1 w-full max-w-4xl mx-auto flex flex-col relative p-4 md:p-8 h-full overflow-hidden fade-in">

        <div class="flex-1 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border border-gray-200/60 dark:border-gray-700/60 rounded-3xl shadow-[0_20px_50px_rgb(0,0,0,0.05)] dark:shadow-none flex flex-col overflow-hidden relative">

            <div class="absolute left-10 top-0 bottom-0 w-[1px] bg-red-200 dark:bg-red-900/30 z-0 hidden md:block"></div>
            <div class="absolute left-11 top-0 bottom-0 w-[1px] bg-red-200 dark:bg-red-900/30 z-0 hidden md:block"></div>

            <div class="flex-none flex justify-between items-center px-4 py-3 bg-gray-50/80 dark:bg-gray-800/50 border-b border-gray-100 dark:border-gray-700 z-10">
                <div class="flex gap-2">
                    <button onclick="insertTextAtCursor(getFormattedDate() + ' 🌤️ ')" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-emerald-500 hover:bg-emerald-50 dark:hover:bg-gray-700 shadow-sm border border-gray-100 dark:border-gray-700 transition-all active:scale-95" title="插入当前时间">
                        <i class="fa-regular fa-clock"></i>
                    </button>
                    <button onclick="insertTextAtCursor('📍 【当前位置】：')" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-emerald-500 hover:bg-emerald-50 dark:hover:bg-gray-700 shadow-sm border border-gray-100 dark:border-gray-700 transition-all active:scale-95" title="插入位置标识">
                        <i class="fa-solid fa-location-dot"></i>
                    </button>
                    <button onclick="insertTextAtCursor('-'.repeat(30) )" class="w-9 h-9 flex items-center justify-center rounded-xl bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 hover:text-emerald-500 hover:bg-emerald-50 dark:hover:bg-gray-700 shadow-sm border border-gray-100 dark:border-gray-700 transition-all active:scale-95" title="插入分割线">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                </div>

                <div class="flex gap-2">
                    <button onclick="clearDiary()" class="px-3 py-1.5 flex items-center justify-center rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 text-xs font-bold transition-all active:scale-95">
                        <i class="fa-solid fa-trash-can mr-1.5"></i> 清空
                    </button>
                </div>
            </div>

            <div class="flex-1 relative z-10 overflow-hidden flex flex-col">
                <textarea id="diary-editor"
                    class="flex-1 w-full h-full bg-transparent border-none resize-none px-6 py-6 md:pl-16 text-gray-800 dark:text-gray-200 font-serif text-[17px] placeholder-gray-400 dark:placeholder-gray-600 paper-texture scrollbar-hide"
                    placeholder="2026年的春天，我来到了... (记录下旅途的点滴、好吃的餐厅、或是突发的灵感)"></textarea>
            </div>

            <div class="flex-none flex justify-between items-center px-6 py-3 bg-white/90 dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 z-10 text-[11px] text-gray-400 font-medium">
                <div>
                    NaviMAS 专属旅途随笔
                </div>
                <div>
                    <i class="fa-solid fa-feather-pointed mr-1 text-emerald-400"></i> 字数: <span id="word-count" class="text-gray-600 dark:text-gray-300 font-bold ml-0.5">0</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const editor = document.getElementById('diary-editor');
        const saveStatus = document.getElementById('save-status');
        const wordCountDisplay = document.getElementById('word-count');
        let saveTimeout;

        // 1. 页面加载时：读取数据并聚焦
        document.addEventListener('DOMContentLoaded', () => {
            const savedDiary = localStorage.getItem('navimas_diary');
            if (savedDiary) {
                editor.value = savedDiary;
            }
            updateWordCount();

            // 延迟一点聚焦，体验更好
            setTimeout(() => {
                editor.focus();
                editor.setSelectionRange(editor.value.length, editor.value.length);
            }, 100);
        });

        // 2. 实时输入与自动保存 (Debounce)
        editor.addEventListener('input', () => {
            updateWordCount();

            saveStatus.innerHTML = '<i class="fa-solid fa-pen-nib fa-bounce text-emerald-500"></i> 书写中...';
            saveStatus.classList.replace('bg-gray-100/80', 'bg-emerald-50');
            saveStatus.classList.replace('text-gray-500', 'text-emerald-600');

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                localStorage.setItem('navimas_diary', editor.value);
                saveStatus.innerHTML = '<i class="fa-solid fa-cloud-check text-gray-400"></i> 已自动保存';
                saveStatus.classList.replace('bg-emerald-50', 'bg-gray-100/80');
                saveStatus.classList.replace('text-emerald-600', 'text-gray-500');
            }, 800);
        });

        // 3. 工具函数：在光标处插入文字
        function insertTextAtCursor(text) {
            const startPos = editor.selectionStart;
            const endPos = editor.selectionEnd;
            editor.value = editor.value.substring(0, startPos) + text + editor.value.substring(endPos, editor.value.length);

            // 将光标移至插入的文字后面
            editor.selectionStart = editor.selectionEnd = startPos + text.length;
            editor.focus();

            // 手动触发 input 事件以激活保存和字数统计
            editor.dispatchEvent(new Event('input'));
        }

        // 4. 工具函数：获取格式化的当前日期时间
        function getFormattedDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `\n【${year}年${month}月${day}日 ${hours}:${minutes}】\n`;
        }

        // 5. 工具函数：更新字数统计
        function updateWordCount() {
            // 中英文混合的简单字数统计，去除两端空格后按空白字符分割，再加上中文字符数
            const text = editor.value.trim();
            if (!text) {
                wordCountDisplay.innerText = '0';
                return;
            }
            // 匹配中文字符、英文字词、数字
            const words = text.match(/[\u4e00-\u9fa5]|[a-zA-Z0-9]+/g);
            wordCountDisplay.innerText = words ? words.length : 0;
        }

        // 6. 工具函数：清空日记
        function clearDiary() {
            if (confirm("确定要清空整篇日记吗？此操作无法撤销。")) {
                editor.value = '';
                editor.dispatchEvent(new Event('input')); // 触发保存
                editor.focus();
            }
        }
    </script>
</body>
</html>
