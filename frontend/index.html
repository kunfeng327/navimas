<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行程大师 Agent 多智能体系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // 后端 API 基础路径（优先使用 frontend/config.js 中的 window.ENV.API_BASE）
        const __API_BASE__ = (window.ENV && typeof window.ENV.API_BASE === 'string') ? window.ENV.API_BASE.replace(/\/$/, '') : '';
        function buildApi(path) {
            // path 应以 '/' 开头
            return (__API_BASE__ ? __API_BASE__ : '') + path;
        }
        tailwind.config = {
            darkMode: 'class',
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .prose pre { background-color: #f8fafc; padding: 1em; border-radius: 0.75em; border: 1px solid #e2e8f0; color: #334155; }
        .dark .prose pre { background-color: #1f2937; border-color: #374151; color: #e5e7eb; }
        .prose code { color: #059669; font-weight: 600; background-color: #d1fae5; padding: 0.1rem 0.3rem; border-radius: 0.25rem;}
        .dark .prose code { color: #34d399; background-color: transparent; padding: 0;}
        /* --- 1. 专属的任务标题卡片（精准制导，不再误伤普通 h3） --- */
        .prose .task-header-card {
            background: linear-gradient(to right, #ecfdf5, transparent);
            color: #047857;
            padding: 0.75rem 1rem;
            border-left: 5px solid #10b981;
            border-radius: 0.5rem;
            margin-top: 3rem !important;
            margin-bottom: 1.5rem;
            font-size: 1.15rem;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            display: block; /* 确保 div 独占一行 */
        }
        /* 夜间模式适配 */
        .dark .prose .task-header-card {
            background: linear-gradient(to right, rgba(6, 78, 59, 0.4), transparent);
            color: #34d399;
            border-left-color: #059669;
        }

        /* --- 2. 恢复大模型生成的普通 h3 的默认样式 --- */
        .prose h3 {
            color: #1e293b;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            border: none; /* 清除底边框等多余样式 */
            background: transparent;
            padding: 0;
        }
        .dark .prose h3 { color: #e5e7eb; }

        /* 顺便美化一下 Markdown 的水平分割线 */
        .prose hr {
            border-color: #e2e8f0;
            border-top-width: 2px;
            border-style: dashed; /* 虚线分割更高级 */
            margin: 2.5rem 0;
        }
        .dark .prose hr { border-color: #374151; }
        .prose strong { color: #0f766e; }
        .dark .prose strong { color: #14b8a6; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 h-screen flex overflow-hidden font-sans transition-colors duration-300">

    <aside class="w-64 lg:w-72 bg-white dark:bg-gray-950 border-r border-gray-200 dark:border-gray-800 flex-col hidden md:flex shadow-sm z-10 transition-colors duration-300">
        <div class="p-6 border-b border-gray-100 dark:border-gray-800">
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 to-cyan-600 dark:from-emerald-400 dark:to-cyan-400 flex items-center">
                <img src="logo.png" class="w-8 h-8 mr-2 object-contain" alt="logo"> NaviMAS
            </h1>
            <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest">智游图谱 Agent</p>
        </div>
        <div id="history-list" class="p-4 flex-1 overflow-y-auto space-y-2 text-sm text-gray-600 dark:text-gray-400">
            <p class="px-2 text-xs font-semibold text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-wider">历史规划记录</p>
        </div>
        <div class="px-4 pb-2 space-y-1 border-t border-gray-100 dark:border-gray-800 pt-3">
            <button onclick="window.location.href='information.html'" class="w-full group flex items-center justify-between px-3 py-2 text-sm text-gray-600 dark:text-gray-300 rounded-lg hover:bg-orange-50 dark:hover:bg-orange-900/20 hover:text-orange-600 dark:hover:text-orange-400 transition-colors">
                <span class="flex items-center font-medium"><i class="fa-solid fa-fire text-orange-500 mr-2 group-hover:scale-110 transition-transform"></i> 热门旅游资讯</span>
                <i class="fa-solid fa-arrow-right-to-bracket text-[10px] opacity-50"></i>
            </button>
            <button onclick="window.location.href='profile.html'" class="w-full group flex items-center justify-between px-3 py-2 text-sm text-gray-600 dark:text-gray-300 rounded-lg hover:bg-blue-50 dark:hover:bg-blue-900/20 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                <span class="flex items-center font-medium"><i class="fa-solid fa-address-card text-blue-500 mr-2 group-hover:scale-110 transition-transform"></i> 个人行程档案</span>
                <i class="fa-solid fa-arrow-right-to-bracket text-[10px] opacity-50"></i>
            </button>
        </div>
        <div class="p-4 border-t border-gray-100 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900/30">
            <button onclick="window.open('diary.html', '_blank')" class="w-full group relative flex items-center justify-center gap-2 px-4 py-3 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl hover:border-emerald-400 dark:hover:border-emerald-500 hover:text-emerald-500 dark:hover:text-emerald-400 transition-all shadow-sm active:scale-95 text-gray-600 dark:text-gray-300 text-sm font-medium">
                <i class="fa-solid fa-book-journal-whills text-emerald-500 group-hover:scale-110 transition-transform"></i>
                <span>打开随行日记本</span>
                <i class="fa-solid fa-arrow-up-right-from-square absolute right-4 text-[10px] text-gray-300 dark:text-gray-600 opacity-0 group-hover:opacity-100 transition-opacity"></i>
            </button>
        </div>
        <div class="p-4 border-t border-gray-100 dark:border-gray-800 text-[10px] text-gray-400 dark:text-gray-500">
            研究主题：TDAG任务分解与动态校验
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative h-full bg-[#f8fafc] dark:bg-[#0f172a] transition-colors duration-300">

        <button onclick="toggleTheme()" class="absolute top-6 right-6 w-10 h-10 flex items-center justify-center rounded-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-700 shadow-sm transition-all duration-300 z-50 focus:outline-none active:scale-95">
            <i id="theme-icon" class="fa-solid fa-moon text-lg"></i>
        </button>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-8 pb-8">
            <div class="flex justify-center items-center h-full" id="welcome-screen">
                <div class="text-center fade-in">
                    <div class="mx-auto mb-6 transform transition-all duration-300 hover:scale-110 flex justify-center">
                        <img src="logo.png" alt="Logo" class="h-24 w-auto object-contain">
                    </div>

                    <h2 class="text-2xl font-bold mb-3 tracking-wide text-gray-800 dark:text-gray-100">欢迎使用 NaviMAS 智游图谱</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md mx-auto text-sm leading-relaxed">
                        基于 TDAG 图结构与多智能体博弈，为您智能调度交通、酒店与景点，主动规避时间与预算冲突。
                    </p>
                </div>
            </div>
        </div>

        <div class="w-full shrink-0 pb-6 pt-2 px-4 md:px-8 transition-colors duration-300">
            <div class="max-w-4xl mx-auto">

                <div class="bg-white/95 dark:bg-gray-800/95 backdrop-blur-xl border border-gray-200 dark:border-gray-700 rounded-3xl p-4 md:p-5 shadow-2xl dark:shadow-emerald-900/10 transition-colors duration-300">

                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 md:gap-4 mb-4">
                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1">
                                <i class="fa-solid fa-location-dot text-emerald-500 mr-1"></i> 目的地
                            </label>

                            <input
                                type="text"
                                id="param-region"
                                list="region-list"
                                placeholder="选择或输入目的地..."
                                class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-emerald-400 transition-colors"
                            >

                            <datalist id="region-list">
                                    <option value="北京">📍 国内热门TOP1 | 北京 (Beijing)</option>
                                    <option value="南京">📍 国内热门TOP2 | 南京 (Nanjing)</option>
                                    <option value="西安">📍 国内热门TOP3 | 西安 (Xi'an)</option>
                                    <option value="成都">📍 国内热门TOP4 | 成都 (Chengdu)</option>
                                    <option value="昆明">📍 国内热门TOP5 | 昆明 (Kunming)</option>
                            </datalist>

                            <p class="mt-1.5 pl-1 text-[11px] text-gray-400 dark:text-gray-400">
                                <i class="fa-solid fa-keyboard mr-1"></i>
                            </p>
                        </div>
                        <div class="flex flex-col col-span-2">
                            <label class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1"><i class="fa-regular fa-calendar text-emerald-500 mr-1"></i> 出行日期</label>
                            <div class="flex items-center space-x-2">
                                <input type="text" id="param-start-date" placeholder="年/月/日"
                                    onfocus="this.type='date'; this.min = new Date().toISOString().split('T')[0];"
                                    onblur="if(!this.value) this.type='text'"
                                    class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-xs sm:text-sm rounded-xl px-2 py-2.5 focus:outline-none focus:border-emerald-400 transition-colors cursor-pointer placeholder-gray-400">

                                <span class="text-gray-400 text-xs">-</span>

                                <input type="text" id="param-end-date" placeholder="年/月/日"
                                    onfocus="this.type='date'; this.min = new Date().toISOString().split('T')[0];"
                                    onblur="if(!this.value) this.type='text'"
                                    class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-xs sm:text-sm rounded-xl px-2 py-2.5 focus:outline-none focus:border-emerald-400 transition-colors cursor-pointer placeholder-gray-400">
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1"><i class="fa-solid fa-user-group text-emerald-500 mr-1"></i> 出行人数</label>
                            <div class="relative">
                                <input type="number" id="param-people" min="1" max="20" value="2" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-sm rounded-xl pl-3 pr-8 py-2.5 focus:outline-none focus:border-emerald-400 transition-colors">
                                <span class="absolute right-3 top-2.5 text-gray-400 dark:text-gray-500 text-sm pointer-events-none">人</span>
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <label class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1.5 pl-1"><i class="fa-solid fa-sack-dollar text-emerald-500 mr-1"></i> 整体预算</label>
                            <div class="relative">
                                <input type="number" id="param-budget" min="100" step="100" value="3000" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 text-sm rounded-xl pl-3 pr-8 py-2.5 focus:outline-none focus:border-emerald-400 transition-colors">
                                <span class="absolute right-3 top-2.5 text-gray-400 dark:text-gray-500 text-sm pointer-events-none">元</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-span-full mb-2">
                        <div id="image-preview-container" class="hidden relative mb-3 w-fit">
                            <img id="image-preview" src="#" class="h-24 w-32 object-cover rounded-xl border-2 border-emerald-500 shadow-lg">
                            <button onclick="clearImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow-md hover:bg-red-600 transition-colors">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <label for="image-upload" class="inline-flex items-center gap-2 px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-lg text-xs font-bold border border-emerald-200 dark:border-emerald-800/50 cursor-pointer hover:bg-emerald-100 transition-all active:scale-95">
                            <i class="fa-solid fa-camera"></i>
                            <span>上传图片，AI 自动识别景点</span>
                            <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                        </label>
                    </div>
                    <div class="flex items-end gap-3 mt-2">
                        <textarea id="user-input" rows="1"
                            class="flex-1 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-white rounded-2xl px-4 py-3.5 focus:outline-none focus:border-emerald-400 dark:focus:border-emerald-500 transition-all duration-300 resize-none text-sm placeholder-gray-400 dark:placeholder-gray-500"
                            placeholder="（选填）其他特殊要求，例如：带父母不想太累..."
                            oninput="this.style.height = '';this.style.height = Math.min(this.scrollHeight, 100) + 'px'"></textarea>

                        <button id="send-btn" onclick="sendMessage()"
                            class="shrink-0 py-3 px-6 bg-white hover:bg-emerald-50 text-emerald-600 rounded-xl transition-all active:scale-95 border-2 border-emerald-300 shadow-sm font-bold text-base flex items-center">
                            启动 Agent <i class="fa-solid fa-paper-plane ml-2 text-sm"></i>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <aside class="w-80 xl:w-96 bg-white dark:bg-gray-950 border-l border-gray-200 dark:border-gray-800 hidden lg:flex flex-col shadow-sm z-10 transition-colors duration-300 relative">

        <div class="p-5 border-b border-gray-100 dark:border-gray-800 flex justify-between items-center">
            <h2 class="text-sm font-bold text-gray-800 dark:text-gray-100 flex items-center tracking-wide">
                <i class="fa-solid fa-map-location-dot text-emerald-300 dark:text-emerald-200 mr-2"></i> 智能沙盘演示
            </h2>
            <span id="viz-status-badge" class="text-[10px] bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 px-2 py-1 rounded-md border border-gray-200 dark:border-gray-700 transition-colors duration-300">待机中</span>
        </div>

        <div class="flex-1 overflow-y-auto p-5 space-y-6">

            <div>
                <h3 class="text-xs font-bold text-gray-400 dark:text-gray-500 mb-3 uppercase tracking-widest flex items-center">
                    <i class="fa-solid fa-satellite mr-1.5"></i> 空间拓扑 (Spatial Map)
                </h3>
                <div class="relative w-full h-44 bg-gray-100 dark:bg-gray-800 rounded-2xl overflow-hidden border border-gray-200 dark:border-gray-700 shadow-sm group">
                    <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=600&q=80" alt="Map" class="w-full h-full object-cover opacity-60 dark:opacity-40 group-hover:opacity-80 transition-opacity duration-300 filter grayscale sepia-[.2]">

                    <div class="absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-t from-gray-900/60 to-transparent">
                        <div id="map-pin" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center animate-pulse mb-2 hidden">
                            <div class="w-3 h-3 bg-emerald-400 rounded-full"></div>
                        </div>
                        <span id="map-text" class="relative z-10 bg-white/90 dark:bg-gray-900/90 text-gray-700 dark:text-gray-200 text-xs px-4 py-1.5 rounded-full backdrop-blur-md flex items-center border border-gray-200 dark:border-gray-700 shadow-sm font-medium">
                            <i class="fa-solid fa-layer-group text-gray-400 dark:text-gray-500 mr-1.5"></i> 等待构建图结构...
                        </span>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-gray-400 dark:text-gray-500 mb-4 uppercase tracking-widest flex items-center">
                    <i class="fa-solid fa-timeline mr-1.5"></i> 日程编排 (Timeline)
                </h3>
                <div id="timeline-container" class="relative pl-3 border-l-2 border-dashed border-gray-200 dark:border-gray-700 ml-2 space-y-6">

                    <div class="relative timeline-item">
                        <div class="absolute -left-[17px] top-1 w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600 ring-4 ring-white dark:ring-gray-950"></div>
                        <div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-3 border border-gray-100 dark:border-gray-700/50">
                            <div class="text-xs text-gray-400 dark:text-gray-500 mb-1 flex items-center"><i class="fa-regular fa-clock mr-1"></i> -- : --</div>
                            <div class="text-sm text-gray-500 dark:text-gray-400 font-medium">系统挂起中，请在左侧输入需求</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </aside>

    <script>
        // 夜间模式切换
        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.classList.remove('fa-sun', 'text-amber-400');
                icon.classList.add('fa-moon', 'text-gray-500');
            } else {
                html.classList.add('dark');
                icon.classList.remove('fa-moon', 'text-gray-500');
                icon.classList.add('fa-sun', 'text-amber-400');
            }
        }

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const welcomeScreen = document.getElementById('welcome-screen');

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 核心发送逻辑
        let isProcessing = false;
        async function sendMessage() {
            if (isProcessing) return; // 防止重复点击
            isProcessing = true
            const currentSessionId = "trip_" + Date.now();

            const region = document.getElementById('param-region').value;
            const startDate = document.getElementById('param-start-date').value;
            const endDate = document.getElementById('param-end-date').value;
            const people = document.getElementById('param-people').value;
            const budget = document.getElementById('param-budget').value;
            const requirements = document.getElementById('user-input').value.trim();
            // 获取图片 Base64（如果用户上传了的话）
            const imagePreview = document.getElementById('image-preview');
            // 检查预览容器是否可见，且 src 是否包含有效的 base64 数据
            const imageBase64 = (imagePreview && !document.getElementById('image-preview-container').classList.contains('hidden'))
                                ? imagePreview.src
                                : null;
            if (!startDate || !endDate || !people || !budget) {
                alert("请填写完整的出行日期、人数和预算信息！");
                return;
            }

            const startTimestamp = new Date(startDate).getTime();
            const endTimestamp = new Date(endDate).getTime();
            if (endTimestamp < startTimestamp) {
                alert("结束日期不能早于开始日期！");
                return;
            }

            // 计算一共游玩多少天
            const days = Math.ceil((endTimestamp - startTimestamp) / (1000 * 3600 * 24)) + 1;

            const assembledPrompt = `我计划去【${region}】旅行，出行日期为【${startDate}】至【${endDate}】（共 ${days} 天）。本次出行一共【${people}】人，我们的总预算是极限【${budget}】元。
核心诉求与约束条件：${requirements ? requirements : '无特殊要求，请结合具体的日期安排高性价比的合理行程，注意避开部分场馆的周一闭馆日，切勿超支。'}`;

            console.log("🚀 即将发送给大模型的 Prompt 是：\n", assembledPrompt);

            if(welcomeScreen) welcomeScreen.style.display = 'none';

            const displayTags = `
                <div class="flex flex-wrap gap-2 mb-2">
                    <span class="bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded text-xs border border-emerald-200 dark:border-emerald-800"><i class="fa-solid fa-location-dot"></i> ${region}</span>
                    <span class="bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 px-2 py-0.5 rounded text-xs border border-blue-200 dark:border-blue-800"><i class="fa-regular fa-calendar"></i> ${days}天</span>
                    <span class="bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-300 px-2 py-0.5 rounded text-xs border border-purple-200 dark:border-purple-800"><i class="fa-solid fa-user-group"></i> ${people}人</span>
                    <span class="bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300 px-2 py-0.5 rounded text-xs border border-amber-200 dark:border-amber-800"><i class="fa-solid fa-sack-dollar"></i> ${budget}元</span>
                </div>
                <div class="text-gray-800 dark:text-gray-100">${requirements || '<i>(系统默认：高性价比合理行程)</i>'}</div>
            `;
            appendUserMessage(displayTags);

            saveToDB(currentSessionId, 'user', assembledPrompt);
            document.getElementById('user-input').value = '';
            document.getElementById('user-input').style.height = 'auto';

            simulateVisualizationPanelUpdate(region);

            const loadingId = appendLoadingMessage();
            const logCid = initLogContainer();
            const ansCid = initAnswerContainer();

        try {
                const response = await fetch(buildApi('/api/chat'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: assembledPrompt,
                        region: region,
                        image: imageBase64
                    })
                });

                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) loadingElement.remove();

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                let fullAnswerText = '';
                let hasShownFailure = false;

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    let parts = buffer.split('\n\n');
                    buffer = parts.pop();

                    for (const part of parts) {
                        const line = part.trim();
                        if (!line || !line.startsWith('data: ')) continue;

                        try {
                            const jsonString = line.slice(6).trim();
                            const data = JSON.parse(jsonString);

                            switch (data.type) {
                                case 'log':
                                    if (data.content.includes("校验失败") || data.content.includes("致命冲突")) {
                                        if (!hasShownFailure) {
                                            const match = data.content.match(/校验失败：(.*?)。/);
                                            const reason = match ? match[1] : "时空逻辑或预算不合理";
                                            renderSingleLog(logCid, `⚠️ **[第一次校验失败]** 触发重试。原因：${reason}`);
                                            hasShownFailure = true;
                                        }
                                    } else {
                                        renderSingleLog(logCid, data.content);
                                    }
                                    break;

                                case 'answer_piece':
                                    // 渲染文本并累加到全量变量，供后端 extractor 下次参考（如果需要的话）
                                    appendToAnswer(ansCid, data.content);
                                    fullAnswerText += data.content;
                                    break;

                                case 'timeline_data':
                                    // 核心：这是触发右侧沙盘渲染的唯一地方
                                    console.log("收到结构化数据:", data.content);
                                    finishVisualizationPanel(data.content);

                                    // 在正文末尾追加一个“保存记录”按钮
                                    const ansEl = document.getElementById(ansCid);
                                    const saveBtnId = 'save-btn-' + Date.now();

                                    // 插入一条虚线分割线和右对齐的保存按钮
                                    ansEl.insertAdjacentHTML('beforeend', `
                                        <div class="mt-8 pt-5 border-t border-dashed border-gray-200 dark:border-gray-700 flex justify-end fade-in">
                                            <button id="${saveBtnId}" class="px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:border-emerald-400 dark:hover:border-emerald-500 hover:text-emerald-500 dark:hover:text-emerald-400 text-gray-600 dark:text-gray-300 rounded-xl text-sm transition-all shadow-sm flex items-center active:scale-95 font-medium">
                                                <i class="fa-regular fa-bookmark mr-2"></i> 存入历史记录
                                            </button>
                                        </div>
                                    `);

                                    // 绑定点击事件，将当前表单的日期和地点传给保存函数
                                    document.getElementById(saveBtnId).onclick = function() {
                                        saveToHistory(startDate, region, data.content, currentSessionId, this);
                                    };
                                    break;

                                case 'error':
                                    appendErrorMessage(data.content);
                                    break;
                            }
                        } catch (e) {
                            console.error("解析单行 JSON 出错:", e);
                        }
                    }
                }

                if (fullAnswerText) {
                    saveToDB(currentSessionId, 'ai', fullAnswerText);
                }

            } catch (error) {
                isProcessing = false;
                const loadingElement = document.getElementById(loadingId);
                if(loadingElement) loadingElement.remove();
                appendErrorMessage("无法连接到旅行管家核心，请检查后台 Agent 服务是否启动。");
            } finally {
            isProcessing = false;
            }
        }

        /* 右侧可视化面板的动态联动逻辑 */

            mapText.className = "relative z-10 bg-emerald-50 dark:bg-emerald-900/80 text-emerald-700 dark:text-emerald-300 text-xs px-4 py-1.5 rounded-full backdrop-blur-md flex items-center border border-emerald-200 dark:border-emerald-700 shadow-sm font-bold fade-in";

            const timeline = document.getElementById('timeline-container');
            timeline.innerHTML = `
                <div class="relative fade-in">
                    <div class="absolute -left-[17px] top-1 w-2.5 h-2.5 rounded-full bg-amber-400 ring-4 ring-white dark:ring-gray-950"></div>

                        <div class="text-xs text-amber-500 mb-1 flex items-center"><i class="fa-solid fa-bolt mr-1 animate-pulse"></i> Planner 解析中</div>
                        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-3/4 mb-2 animate-pulse"></div>
                        <div class="h-3 bg-gray-200 dark:bg-gray-700 rounded w-1/2 animate-pulse"></div>
                    </div>
                </div>
                <div class="relative fade-in" style="animation-delay: 0.2s">
                    <div class="absolute -left-[17px] top-1 w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600 ring-4 ring-white dark:ring-gray-950"></div>
                    <div class="bg-gray-50 dark:bg-gray-800/50 rounded-xl p-3 border border-gray-100 dark:border-gray-700/50">
                        <div class="text-xs text-gray-400 mb-1 flex items-center"><i class="fa-solid fa-lock mr-1"></i> Executor 挂起</div>
                        <div class="text-sm text-gray-500 dark:text-gray-400 font-medium">等待 TDAG 依赖释放...</div>
                    </div>

            `;

        function finishVisualizationPanel(timelineData) {
            if (timelineData) {
                localStorage.setItem('navimas_agent_data', JSON.stringify(timelineData));
            }

            const badge = document.getElementById('viz-status-badge');
            badge.className = "text-[10px] bg-emerald-100 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 px-2 py-1 rounded-md border border-emerald-200 dark:border-emerald-800/50 flex items-center";
            badge.innerHTML = '<i class="fa-solid fa-check-double mr-1"></i> 方案已生成';

            document.getElementById('map-pin').classList.add('hidden');
            const mapText = document.getElementById('map-text');

            mapText.innerHTML = `<i class="fa-solid fa-route text-emerald-500 mr-1.5"></i> 最优游玩路线拓扑已建立 <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-[10px] opacity-75"></i>`;

            mapText.className = "relative z-10 bg-white dark:bg-gray-800 text-emerald-600 dark:text-emerald-400 text-xs px-4 py-2 rounded-full backdrop-blur-md flex items-center border-2 border-emerald-400/80 dark:border-emerald-500/80 shadow-md font-bold cursor-pointer hover:bg-emerald-50 dark:hover:bg-gray-700 hover:-translate-y-0.5 hover:shadow-lg transition-all duration-300 active:scale-95 fade-in";

            mapText.onclick = function() {
                window.open('amap-sandbox.html', '_blank');
            };

            const timeline = document.getElementById('timeline-container');

            if (timelineData && timelineData.days && timelineData.days.length > 0) {
                let html = '';
                timelineData.days.forEach((day, index) => {
                    let detailsHtml = '';
                    day.details.forEach(detail => {
                        let timeColor = "text-amber-500";
                        if(detail.time.includes("下")) timeColor = "text-blue-500";
                        if(detail.time.includes("晚") || detail.time.includes("夜")) timeColor = "text-purple-500";

                        detailsHtml += `
                            <div class="flex items-start mt-2.5">
                                <span class="font-bold ${timeColor} text-xs w-10 shrink-0 mt-0.5 tracking-wide">${detail.time}</span>
                                <span class="text-xs text-gray-600 dark:text-gray-300 leading-relaxed flex-1 ml-1">${detail.desc}</span>
                            </div>
                        `;
                    });

                    const dateBadge = day.date ? `<span class="bg-emerald-100 dark:bg-emerald-900/50 px-1.5 py-0.5 rounded mr-1 shadow-sm">${day.date}</span>` : '';

                    html += `
                        <div class="relative timeline-item fade-in" style="animation-delay: ${index * 0.1}s">
                            <div class="absolute -left-[17px] top-1.5 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-4 ring-white dark:ring-gray-950 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div>
                            <div class="bg-white dark:bg-gray-800/80 rounded-xl p-3.5 border border-emerald-100 dark:border-emerald-800/50 shadow-sm mb-5 transition-all hover:shadow-md hover:border-emerald-300">
                                <div class="text-sm text-emerald-700 dark:text-emerald-400 font-bold border-b border-emerald-50 dark:border-emerald-900/30 pb-2 mb-2">
                                    <span class="text-gray-600 dark:text-gray-300 mr-1">${day.dayLabel}</span>
                                    ${dateBadge}
                                    ${day.title}
                                </div>
                                <div class="space-y-1">
                                    ${detailsHtml}
                                </div>
                            </div>
                        </div>
                    `;
                });
                timeline.innerHTML = html;
            } else {
                timeline.innerHTML = `<div class="text-xs text-gray-500">无法结构化提取日程，请参考左侧正文。</div>`;
            }
        }

        function appendUserMessage(t) {
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="flex justify-end fade-in max-w-3xl mx-auto w-full">
                    <div class="bg-emerald-50 dark:bg-emerald-600/20 border border-emerald-100 dark:border-emerald-500/30 text-emerald-900 dark:text-gray-100 px-6 py-4 rounded-2xl rounded-tr-none shadow-sm text-sm transition-colors duration-300">
                        ${t}
                    </div>
                </div>
            `);
        }

        function initLogContainer() {
            const id = 'log-' + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="flex justify-start fade-in max-w-3xl mx-auto w-full" id="${id}">
                    <div class="w-10 h-10 rounded-xl bg-cyan-50 dark:bg-cyan-900/30 border border-cyan-100 dark:border-cyan-700/50 flex items-center justify-center mr-4 flex-shrink-0 shadow-sm transition-colors duration-300">
                        <i class="fa-solid fa-network-wired text-cyan-600 dark:text-cyan-400"></i>
                    </div>
                    <div class="w-full bg-white dark:bg-gray-800/20 border border-gray-100 dark:border-gray-700/50 rounded-2xl p-5 shadow-sm transition-colors duration-300">
                        <h3 class="text-xs font-bold text-cyan-600 dark:text-cyan-500 uppercase tracking-widest flex items-center mb-3 border-b border-gray-100 dark:border-gray-700/50 pb-2 transition-colors duration-300">
                            <span class="relative flex h-2 w-2 mr-2">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                            </span>
                            TDAG 动态执行拓扑
                        </h3>
                        <div id="${id}-list" class="space-y-1"></div>
                    </div>
                </div>
            `);
            return id;
        }

        function initAnswerContainer() {
            const id = 'ans-' + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="flex justify-start fade-in max-w-3xl mx-auto w-full mt-2">
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-100 dark:border-emerald-700/50 flex items-center justify-center mr-4 flex-shrink-0 shadow-sm transition-colors duration-300">
                        <i class="fa-solid fa-map-location-dot text-emerald-600 dark:text-emerald-400"></i>
                    </div>
                    <div id="${id}" class="w-full prose prose-emerald dark:prose-invert text-sm text-gray-700 dark:text-gray-200 bg-white dark:bg-gray-800/30 p-6 rounded-2xl border border-gray-100 dark:border-gray-700/50 shadow-sm transition-colors duration-300">
                    </div>
                </div>
            `);
            return id;
        }

        function renderSingleLog(cid, content) {
            const list = document.getElementById(`${cid}-list`);
            const div = document.createElement('div');
            div.className = 'text-[13px] text-gray-600 dark:text-gray-300 fade-in border-b border-gray-50 dark:border-gray-800/40 pb-2 mt-2 flex items-start gap-3 transition-colors duration-300';

            let iconHtml = '<i class="fa-solid fa-terminal text-gray-400 dark:text-gray-500 mt-1"></i>';
            if (content.includes("TDAG") || content.includes("拆解") || content.includes("构建")) {
                iconHtml = '<i class="fa-solid fa-code-branch text-amber-500 dark:text-amber-400 mt-1"></i>';
            } else if (content.includes("资源调度") || content.includes("匹配环节")) {
                iconHtml = '<i class="fa-solid fa-route text-emerald-500 dark:text-emerald-400 mt-1"></i>';
            } else if (content.includes("逻辑校核") || content.includes("校验")) {
                iconHtml = '<i class="fa-solid fa-scale-balanced text-cyan-500 dark:text-cyan-400 mt-1"></i>';
            } else if (content.includes("通过")) {
                iconHtml = '<i class="fa-solid fa-circle-check text-green-500 mt-1"></i>';
            } else if (content.includes("冲突") || content.includes("重调") || content.includes("打回") || content.includes("异常")) {
                iconHtml = '<i class="fa-solid fa-triangle-exclamation text-rose-500 mt-1 animate-pulse"></i>';
            }

            div.innerHTML = `
                <div class="flex-shrink-0 w-4 text-center">${iconHtml}</div>
                <div class="leading-relaxed flex-1">${marked.parseInline(content)}</div>
            `;
            list.appendChild(div);
            scrollToBottom();
        }

        function appendToAnswer(cid, content) {
            const el = document.getElementById(cid);
            el.innerHTML += marked.parse(content);
            scrollToBottom();
        }

        function appendLoadingMessage() {
            const id = 'loading-' + Date.now();
            chatContainer.insertAdjacentHTML('beforeend', `
                <div id="${id}" class="flex justify-start fade-in max-w-3xl mx-auto w-full">
                    <div class="w-10 h-10 rounded-xl bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-center mr-4 transition-colors duration-300">
                        <i class="fa-solid fa-circle-notch fa-spin text-emerald-500 dark:text-emerald-400"></i>
                    </div>
                    <div class="text-gray-500 dark:text-gray-400 text-sm flex items-center animate-pulse transition-colors duration-300">
                        智能体编排引擎已启动，多线程 API 预热中...
                    </div>
                </div>
            `);
            scrollToBottom();
            return id;
        }

        function appendErrorMessage(t) {
            chatContainer.insertAdjacentHTML('beforeend', `
                <div class="flex justify-center fade-in max-w-3xl mx-auto w-full">
                    <div class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800/30 px-6 py-3 rounded-xl text-xs flex items-center shadow-sm transition-colors duration-300">
                        <i class="fa-solid fa-triangle-exclamation mr-2"></i> ${t}
                    </div>
                </div>
            `);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function saveToHistory(date, region, timelineData, sessionId, btnElement) {
            const formattedDate = date ? date.replace(/-/g, '/') : new Date().toLocaleDateString();
            const title = `${formattedDate} ${region}`;

            let historyList = JSON.parse(localStorage.getItem('navimas_history') || '[]');

            historyList.unshift({
                id: Date.now(),
                sessionId: sessionId,
                title: title,
                timeline: timelineData
            });

            localStorage.setItem('navimas_history', JSON.stringify(historyList));
            renderHistoryList();

            btnElement.innerHTML = `<i class="fa-solid fa-check mr-2"></i> 已保存`;
            btnElement.className = "px-4 py-2 bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-400 text-emerald-600 dark:text-emerald-400 rounded-xl text-sm transition-all shadow-sm flex items-center font-bold cursor-default";
            btnElement.disabled = true;
        }

        function renderHistoryList() {
            const container = document.getElementById('history-list');
            let historyList = JSON.parse(localStorage.getItem('navimas_history') || '[]');

            // 保留顶部的标题，清空下面的列表
            container.innerHTML = '<p class="px-2 text-xs font-semibold text-gray-400 dark:text-gray-500 mb-2 uppercase tracking-wider">历史规划记录</p>';

            if (historyList.length === 0) {
                container.innerHTML += '<div class="px-2 text-xs text-gray-400 mt-4 text-center">暂无记录</div>';
                return;
            }

            historyList.forEach(item => {
                const div = document.createElement('div');
                div.className = 'px-3 py-2.5 mt-1 text-sm text-gray-600 dark:text-gray-300 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800/50 transition-colors flex items-center justify-between group';

                div.innerHTML = `
                    <div class="flex items-center truncate flex-1 cursor-pointer" onclick="loadHistory(${item.id})" title="在沙盘中恢复">
                        <i class="fa-solid fa-clock-rotate-left text-gray-400 group-hover:text-emerald-500 transition-colors mr-2.5"></i>
                        <span class="truncate font-medium">${item.title}</span>
                    </div>
                    <div class="flex items-center">
                        <button onclick="window.open('history.html?session=${item.sessionId}', '_blank')" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-blue-500 transition-all p-1 mr-1" title="查看完整对话记录">
                            <i class="fa-regular fa-comment-dots"></i>
                        </button>
                        <button onclick="deleteHistory(${item.id}, event)" class="opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition-all p-1" title="删除记录">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deleteHistory(id, event) {
            event.stopPropagation(); // 阻止点击事件冒泡
            let historyList = JSON.parse(localStorage.getItem('navimas_history') || '[]');
            historyList = historyList.filter(item => item.id !== id);
            localStorage.setItem('navimas_history', JSON.stringify(historyList));
            renderHistoryList();
        }
        let uploadedImageBase64 = null;

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('image-preview-container').classList.remove('hidden');
                uploadedImageBase64 = e.target.result;

                simulateVisionAnalysis();
            };
            reader.readAsDataURL(file);
        }

        function simulateVisionAnalysis() {
            // 触发右侧状态栏变动
            const badge = document.getElementById('viz-status-badge');
            badge.innerHTML = '<i class="fa-solid fa-eye fa-spin mr-1"></i> Vision Agent 识别中...';

            // 模拟 1.5 秒后识别成功
            setTimeout(() => {
                // 假设识别结果是“故宫角楼”
                const detectedPlace = "故宫角楼（建议日落时分拍摄）";
                const userInput = document.getElementById('user-input');

                // 自动将识别出的景点填入需求框，并加亮提示
                userInput.value = `我想去图片里的【${detectedPlace}】。` + userInput.value;
                userInput.classList.add('ring-2', 'ring-emerald-400');

                badge.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 灵感已捕获';
                setTimeout(() => userInput.classList.remove('ring-2', 'ring-emerald-400'), 2000);
            }, 1500);
        }

        function clearImage() {
            uploadedImageBase64 = null;
            document.getElementById('image-upload').value = '';
            document.getElementById('image-preview-container').classList.add('hidden');
        }

        async function saveToDB(sessionId, role, text) {
            try {
                await fetch(buildApi('/api/history/save'), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        session_id: sessionId,
                        role: role,
                        content: text
                    })
                });
                console.log(`✅ [${role}] 的记录已成功存入数据库！`);
            } catch (e) {
                console.error("数据库保存失败:", e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderHistoryList(); // 渲染历史记录

            const urlParams = new URLSearchParams(window.location.search);
            const importRegion = urlParams.get('region');
            const importIntent = urlParams.get('intent');

            if (importRegion) {
                document.getElementById('param-region').value = importRegion;

                const inputEl = document.getElementById('user-input');
                inputEl.value = `【来自热门资讯】我想去 ${importRegion}。${importIntent || ''}`;

                inputEl.style.height = 'auto';
                inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px';

                inputEl.classList.add('ring-2', 'ring-emerald-400', 'bg-emerald-50', 'dark:bg-emerald-900/20');
                setTimeout(() => {
                    inputEl.classList.remove('ring-2', 'ring-emerald-400', 'bg-emerald-50', 'dark:bg-emerald-900/20');
                }, 2000);

                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        function loadHistory(id) {
            const historyList = JSON.parse(localStorage.getItem('navimas_history') || '[]');
            const record = historyList.find(item => item.id === id);
            if (record && record.timeline) {
                // 隐藏欢迎语
                if(welcomeScreen) welcomeScreen.style.display = 'none';
                // 将历史数据存入临时缓存并渲染右侧沙盘
                localStorage.setItem('navimas_agent_data', JSON.stringify(record.timeline));
                finishVisualizationPanel(record.timeline);

                appendUserMessage(`已从历史记录中恢复：${record.title}`);
            }
        }
    </script>
